<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GreenLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }
        .card {
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo a {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -1px;
        }
        .logo .icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 10px var(--primary));
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        .btn-submit {
            width: 100%;
            margin-top: 1rem;
            justify-content: center;
            padding: 1rem;
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .footer-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-text a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(220, 38, 38, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10000;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div id="toast"></div>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="card glass-card reveal visible">
            <div class="logo">
                <a href="index.html">
                    <span class="icon">🚨</span>
                    GreenLink
                </a>
            </div>

            <h2>Staff Login</h2>
            <p class="subtitle">Sign in to your GreenLink account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-premium btn-submit" id="submitBtn">Sign In</button>
            </form>

            <p class="footer-text">
                No account? <a href="register.html">Create one</a> · <a href="choose-profile.html">← Back</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { loginUser } from "./js/auth.js";

        const form = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 4000);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in…";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await loginUser(email, password);
            } catch (err) {
                console.error("Login component error:", err);
                let message = "Login failed. Please check credentials.";
                if (err.code === "auth/user-not-found") message = "❌ User not found.";
                else if (err.code === "auth/wrong-password") message = "❌ Incorrect password.";
                else if (err.message.includes("role")) message = "❌ Account exists but role is missing.";
                
                showToast(message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>
</body>

</html>
