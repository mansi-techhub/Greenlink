<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GreenLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .register-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
        }
        .card {
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo a {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -1px;
        }
        .logo .icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 10px var(--primary));
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        
        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .role-option input { display: none; }
        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            padding: 1.25rem 0.75rem;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1.25rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .role-label:hover {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.05);
        }
        .role-option input:checked + .role-label {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }
        .role-icon { font-size: 2rem; margin-bottom: 0.2rem; display: block; }
        .role-name { font-weight: 800; font-size: 0.85rem; color: white; }
        .role-desc { font-size: 0.7rem; color: var(--text-dim); line-height: 1.4; margin-top: 0.2rem; }

        .btn-submit {
            width: 100%;
            margin-top: 1rem;
            justify-content: center;
            padding: 1.1rem;
            font-size: 1rem;
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .footer-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-text a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(220, 38, 38, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10000;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div id="toast"></div>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="register-container">
        <div class="card glass-card reveal visible">
            <div class="logo">
                <a href="index.html">
                    <span class="icon">🚨</span>
                    GreenLink
                </a>
            </div>

            <h2>Create Staff Account</h2>
            <p class="subtitle">Register as Traffic Incharge or Police Officer</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0">(min 6 chars)</span></label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <label style="margin-bottom: 0.8rem;">Select Your Role</label>
                <div class="role-options">
                    <div class="role-option">
                        <input type="radio" name="role" id="roleIncharge" value="incharge">
                        <label for="roleIncharge" class="role-label">
                            <span class="role-icon">👮</span>
                            <span class="role-name">Incharge</span>
                            <span class="role-desc">Manage alerts</span>
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" name="role" id="roleOfficer" value="officer">
                        <label for="roleOfficer" class="role-label">
                            <span class="role-icon">🚔</span>
                            <span class="role-name">Officer</span>
                            <span class="role-desc">Clear roads</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-premium btn-submit" id="submitBtn">Create Account</button>
            </form>

            <p class="footer-text">
                Already have an account? <a href="login.html">Sign in</a> · <a href="choose-profile.html">← Back</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { registerUser } from "./js/auth.js";

        const form = document.getElementById("registerForm");
        const submitBtn = document.getElementById("submitBtn");

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 4000);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const roleEl = document.querySelector("input[name='role']:checked");

            if (!roleEl) {
                showToast("⚠️ Please select a role to continue.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account…";

            try {
                await registerUser(name, email, password, roleEl.value);
            } catch (err) {
                showToast("❌ " + (err.message || "Registration failed."));
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>

</html>
